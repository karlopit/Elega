name: Elega QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend-and-browser:
    name: API and Selenium smoke tests
    runs-on: ubuntu-latest
    env:
      API_URL: http://127.0.0.1:8000
      BASE_URL: http://127.0.0.1:3000
      HEADLESS: "true"
      CI: "true"
      ENVIRONMENT: development
      FRONTEND_ORIGINS: '["http://127.0.0.1:3000"]'
      SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/api/requirements.txt
            qa/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend/api

      - name: Install QA dependencies
        run: python -m pip install -r qa/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/app

      - name: Build frontend for browser testing
        run: npm run build
        working-directory: frontend/app
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

      - name: Start backend
        shell: bash
        working-directory: backend/api
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/elega-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/elega-backend.pid"

      - name: Wait for backend
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$API_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/elega-backend.log"
          exit 1

      - name: Start frontend
        shell: bash
        working-directory: frontend/app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/elega-frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/elega-frontend.pid"

      - name: Wait for frontend
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/elega-frontend.log"
          exit 1

      - name: Run API tests
        run: python -m pytest -c qa/pytest.ini qa/tests/api -q

      - name: Run Selenium smoke tests
        run: python -m pytest -c qa/pytest.ini qa/tests/ui -q --html=qa/reports/ui-report.html --self-contained-html

      - name: Upload QA reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            qa/reports/
            ${{ runner.temp }}/elega-backend.log
            ${{ runner.temp }}/elega-frontend.log
          if-no-files-found: warn
